name: Build

# Every push to main and every pull request: the whole solution builds and the tests pass.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build SoundLibert.slnx -c Release
      - name: Test
        run: dotnet test SoundLibert.Domain.Tests -c Release --no-build
